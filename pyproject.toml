"validate_notebooks.py" = [
    "A", "B", "C", "E", "F", "G", "I", "N", "Q", "R", "T", "U", "W", "YTT",
    "ANN", "ARG", "BLE", "COM", "DTZ", "EM", "EXE", "FA", "FBT", "ICN",
