[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snomed-methods"
version = "0.1.0-dev"
description = "Methods and utilities for working with SNOMED CT (Systematized Nomenclature of Medicine - Clinical Terms)"
readme = ".INSTRUCTIONS.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "SNOMED Methods Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "ipykernel"
]

[project.optional-dependencies]
dev = [
    "pytest-mock>=3.6.0",
    "pytest>=7.0.0",
    "black[jupyter]>=24.0.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "pre-commit",
    "pytest-cov>=4.0.0",
]
docs = [
    "sphinx>=8.0.0",
    "furo>=2024.0.0",
    "sphinx-autodoc-typehints>=1.5.0",
]
medcat = [
    "medcat>=1.5.0,<2.0.0",
    "transformers",
    "sentence-transformers",
]

all = [
    "snomed-methods[dev,docs,medcat]",
]

[project.scripts]
snomed-methods = "snomed_methods_v1:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]
skip-string-normalization = true

[tool.ruff]
line-length = 88
target-version = "py38"
lint.select = [
    "A",
    "B",
    "C",
    "E",
    "F",
    "G",
    "I",
    "N",
    "Q",
    "R",
    "T",
    "U",
    "W",
    "YTT",
    "ANN",
    "ARG",
    "BLE",
    "COM",
    "DTZ",
    "EM",
    "EXE",
    "FA",
    "FBT",
    "G",
    "ICN",
    "INP",
    "ISC",
    "PERF",
    "PGH",
    "PIE",
    "PLC0415",
    "INP",
    "ISC",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "RUF",
    "S",
    "SIM",
    "TC",
    "TCH",
    "TRY",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
".github/**/*" = [
    "A", "B", "C", "E", "F", "G", "I", "N", "Q", "R", "T", "U", "W", "YTT",
    "ANN", "ARG", "BLE", "COM", "DTZ", "EM", "EXE", "FA", "FBT", "ICN",
    "INP", "ISC", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RUF",
    "S", "SIM", "TC", "TCH", "TRY", "UP",
]
"notebooks/**/*.ipynb" = ["A", "B", "C", "E", "F", "G", "I", "N", "Q", "R", "T", "U", "W", "YTT", "ANN", "ARG", "BLE", "COM", "DTZ", "EM", "EXE", "FA", "FBT", "ICN", "INP", "ISC", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RUF", "S", "SIM", "TC", "TCH", "TRY", "UP"]
"notebooks/notebook_runner.py" = ["A", "B", "C", "E", "F", "G", "I", "N", "Q", "R", "T", "U", "W", "YTT", "ANN", "ARG", "BLE", "COM", "DTZ", "EM", "EXE", "FA", "FBT", "ICN", "INP", "ISC", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RUF", "S", "SIM", "TC", "TCH", "TRY", "UP"]
"tests/**/*.py" = [
    "S101",
    "PLC0415",
    "SLF001",
    "BLE001",
    "EXE001",
    "CPY001",
    "PTH100",
    "PTH103",
    "PTH108",
    "PTH110",
    "PTH118",
    "PTH119",
    "PTH120",
    "PTH123",
    "PLR2004",
    "ANN001",
    "ARG001",
    "ARG002",
    "ANN201",
