[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snomed-methods"
version = "0.1.0-dev"
description = "Methods and utilities for working with SNOMED CT (Systematized Nomenclature of Medicine - Clinical Terms)"
readme = ".INSTRUCTIONS.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "SNOMED Methods Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest-mock>=3.6.0",
    "pytest>=7.0.0",
    "black[jupyter]>=24.0.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "pre-commit",
]
docs = [
    "sphinx>=8.0.0",
    "furo>=2024.0.0",
    "sphinx-autodoc-typehints>=1.5.0",
]
medcat = [
    "medcat>=1.5.0,<2.0.0",
    "transformers<5.0.0",
    "sentence-transformers<5.0.0",
]

all = [
    "snomed-methods[dev,docs,medcat]",
]

[project.scripts]
snomed-methods = "snomed_methods_v1:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["snomed_methods_v1.py", "snomed_term_lookup.py", "hybrid_search.py"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]
skip-string-normalization = true

[tool.ruff]
line-length = 88
target-version = "py38"
lint.select = [
    "A",
    "B",
    "C",
    "E",
    "F",
    "G",
    "I",
    "N",
    "Q",
    "R",
    "T",
    "U",
    "W",
    "YTT",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"llm_concept_embedder.py" = ["T201", "E501", "C901"]
"semantic_expansion.py" = ["C901", "B028", "E501"]
"tests/notebooks/*.ipynb" = ["T201", "E402", "A004", "B007", "F821", "C901", "E501"]
"notebooks/*.ipynb" = ["T201", "E402", "A004", "B007", "F821", "C901", "E501"]
"snomed_methods_examples.ipynb" = ["T201", "E402", "A004", "B007", "F821", "C901", "E501"]
"test_*.py" = ["T201", "E501", "C901", "B007"]
"validate_notebooks.py" = ["C901", "T201"]
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_kwargs = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
strict_optional = true
no_implicit_optional = true
warn_redundant_returns = true
