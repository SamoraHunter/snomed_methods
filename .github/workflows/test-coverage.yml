name: Test Coverage

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHON_VERSION: '3.10'
    outputs:
      is_self_hosted: ${{ steps.detect_env.outputs.is_self_hosted }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Debug environment
        run: |
          uname -a
          cat /etc/os-release
          env | sort
          which node || true
          node --version || true
          which python || true
          python --version || true
          docker version || true

      - name: Detect Runner Environment
        id: detect_env
        run: |
          IS_SELF_HOSTED=false
          IS_ACT=false
          IS_GITEA=false
          if [ -n "$ACT" ]; then
            echo "Runner environment: local act"
            IS_ACT=true
            IS_SELF_HOSTED=true
          elif [ "${{ github.server_url }}" != "https://github.com" ]; then
            echo "Runner environment: Gitea"
            IS_GITEA=true
            IS_SELF_HOSTED=true
          else
            echo "Runner environment: GitHub.com"
          fi
          echo "is_act=$IS_ACT" >> $GITHUB_OUTPUT
          echo "is_gitea=$IS_GITEA" >> $GITHUB_OUTPUT
          echo "is_self_hosted=$IS_SELF_HOSTED" >> $GITHUB_OUTPUT

      - name: Perform Local Runner Setup
        id: local_setup
        if: steps.detect_env.outputs.is_self_hosted == 'true'
        uses: ./.github/actions/local-setup
        with:
          gitea-token: ${{ secrets.GITEA_TOKEN }}
          python-mirror-url: ${{ vars.PYTHON_MIRROR_URL || env.PYTHON_MIRROR_URL }}
          internal-proxy-host: ${{ vars.INTERNAL_PROXY_HOST || env.INTERNAL_PROXY_HOST }}
          internal-domain: ${{ vars.INTERNAL_DOMAIN || env.INTERNAL_DOMAIN }}
          internal-cert-name: ${{ vars.INTERNAL_CERT_NAME || env.INTERNAL_CERT_NAME }}

      - name: Consolidated Docker Setup for Self-Hosted/Gitea Runners
        if: steps.detect_env.outputs.is_gitea == 'true'
        run: |
          if ! command -v docker &> /dev/null; then
            echo "Docker not found, installing..."
            curl -fsSL https://get.docker.com | sh || true
            if command -v sudo &> /dev/null; then
              sudo usermod -aG docker $USER || true
              sudo chmod 666 /var/run/docker.sock || true
            else
              usermod -aG docker $USER || true
              chmod 666 /var/run/docker.sock || true
            fi
          else
            echo "Docker already available: $(docker --version)"
            if command -v sudo &> /dev/null; then
              sudo chmod 666 /var/run/docker.sock || true
            else
              chmod 666 /var/run/docker.sock || true
            fi
          fi

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        env:
          http_proxy: ${{ env.http_proxy }}
          https_proxy: ${{ env.https_proxy }}
          AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
        with:
          python-version: '3.10.18'
          check-latest: false

      - name: Fix pip installation for local/Gitea runners
        if: steps.detect_env.outputs.is_gitea == 'true'
        run: |
          curl -sS https://bootstrap.pypa.io/get-pip.py | python3 - --ignore-installed
          python3 -m pip install --upgrade --ignore-installed pip setuptools wheel

      - name: Get pip cache directory
        id: pip-cache
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: Cache pip dependencies
        if: steps.detect_env.outputs.is_act != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          INTERNAL_PROXY_HOST_VAR: ${{ vars.INTERNAL_PROXY_HOST || '' }}
          INTERNAL_PYPI_MIRROR_VAR: ${{ vars.INTERNAL_PYPI_MIRROR || '' }}
        run: |
          pip_install_args=()

          if [[ "${{ steps.detect_env.outputs.is_act }}" == "true" ]] && [[ -n "${GITEA_TOKEN}" ]]; then
              INTERNAL_PROXY_HOST="${INTERNAL_PROXY_HOST_VAR:-$INTERNAL_PROXY_HOST}"
              INTERNAL_PYPI_MIRROR="${INTERNAL_PYPI_MIRROR_VAR:-$INTERNAL_PYPI_MIRROR}"

              if [[ -n "${INTERNAL_PROXY_HOST}" ]] && [[ -n "${INTERNAL_PYPI_MIRROR}" ]]; then
                  echo "🔧 Running in act - using local mirror ($INTERNAL_PYPI_MIRROR) and removing hash requirements"
                  find . -name "requirements*.txt" -type f -exec sed -i 's/ --hash=sha256:[a-f0-9]*//g' {} \;
                  pip_install_args+=("--trusted-host" "$INTERNAL_PROXY_HOST" "--extra-index-url" "$INTERNAL_PYPI_MIRROR")
              else
                  echo "⚠️ Running in act but mirror configuration not set, using standard PyPI"
              fi
          fi

          echo "Installing project dependencies..."
          python3 -m pip install "${pip_install_args[@]}" -e ".[all,dev]"

      - name: Run pytest with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage to GitHub Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
